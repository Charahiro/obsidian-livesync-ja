name: Release Obsidian Plugin

on:
  push:
    tags:
      - "ja-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example ja-0.25.60"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/unit-ci.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
    permissions:
      contents: read

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.tag }}"
          fi

          if [[ -z "${tag}" ]]; then
            echo "Release tag is required." >&2
            exit 1
          fi

          if [[ ! "${tag}" =~ ^ja-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the stable form 'ja-X.Y.Z'." >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "upstream_version=${tag#ja-}" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0

      - name: Verify release note version
        shell: bash
        run: |
          version="${{ steps.version.outputs.tag }}"
          version="${version#ja-}"
          expected="# Self-hosted LiveSync 日本語版 ${version}"
          actual="$(head -n 1 .github/release-notes/ja-release.md)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "Release-note title must be '${expected}', but was '${actual}'." >&2
            exit 1
          fi

      - name: Mirror upstream pre-release status
        id: upstream_release
        shell: bash
        env:
          UPSTREAM_VERSION: ${{ steps.version.outputs.upstream_version }}
        run: |
          response="$(curl --fail --silent --show-error --location --retry 3 \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/vrtmrz/obsidian-livesync/releases/tags/${UPSTREAM_VERSION}")"
          prerelease="$(jq -r '.prerelease' <<< "${response}")"
          if [[ "${prerelease}" != 'true' && "${prerelease}" != 'false' ]]; then
            echo "Upstream release metadata has no valid prerelease value." >&2
            exit 1
          fi
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate translation resources
        run: npm run i18n:bake

      - name: Verify generated translation resources
        run: git diff --exit-code -- src/common/messagesJson src/common/messages/combinedMessages.prod.ts

      - name: Audit Japanese translations
        run: npm run i18n:audit-ja

      - name: Build
        run: npm run build

      - name: Attest plugin artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Verify release assets
        shell: bash
        run: |
          test -s main.js
          test -s manifest.json
          test -s styles.css

      - name: Package zip
        shell: bash
        run: |
          package_dir="${{ github.event.repository.name }}"
          zip_name="${{ github.event.repository.name }}-${{ steps.version.outputs.tag }}.zip"

          mkdir "${package_dir}"
          cp main.js manifest.json styles.css README.md "${package_dir}/"
          if [[ -f README_ja.md ]]; then
            cp README_ja.md "${package_dir}/"
          fi
          zip -r "${zip_name}" "${package_dir}"

          echo "ZIP_NAME=${zip_name}" >> "${GITHUB_ENV}"

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP_NAME }}
            main.js
            manifest.json
            styles.css
          name: ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          body_path: .github/release-notes/ja-release.md
          draft: false
          prerelease: ${{ steps.upstream_release.outputs.prerelease }}
          fail_on_unmatched_files: true
