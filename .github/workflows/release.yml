name: Release Obsidian Plugin

on:
  push:
    tags:
      - "ja-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example ja-0.25.60"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.tag }}"
          fi

          if [[ -z "${tag}" ]]; then
            echo "Release tag is required." >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0
          submodules: recursive

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify release assets
        shell: bash
        run: |
          test -s main.js
          test -s manifest.json
          test -s styles.css

      - name: Package zip
        shell: bash
        run: |
          package_dir="${{ github.event.repository.name }}"
          zip_name="${{ github.event.repository.name }}-${{ steps.version.outputs.tag }}.zip"

          mkdir "${package_dir}"
          cp main.js manifest.json styles.css README.md "${package_dir}/"
          if [[ -f README_ja.md ]]; then
            cp README_ja.md "${package_dir}/"
          fi
          zip -r "${zip_name}" "${package_dir}"

          echo "ZIP_NAME=${zip_name}" >> "${GITHUB_ENV}"

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP_NAME }}
            main.js
            manifest.json
            styles.css
          name: ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true
