    グループ ID とパスフレーズは、デバイスのグループを識別するために使用されます。同期するすべてのデバイスで同じグループ ID
    とパスフレーズを使用してください。
The Hash algorithm for chunk IDs: チャンクIDのハッシュアルゴリズム
The IndexedDB adapter often offers superior performance in certain scenarios, but it has been found to cause memory leaks when used with LiveSync mode. When using LiveSync mode, please use IDB adapter instead.: IndexedDBアダプターは一部の状況で高い性能を発揮しますが、LiveSyncモードで使用するとメモリリークが発生することが分かっています。LiveSyncモードでは代わりにIDBアダプターを使用してください。
the latest synchronisation data will be downloaded from the server to this device.: 最新の同期データがサーバーからこのデバイスにダウンロードされます。
the local database, that is to say the synchronisation information, must be reconstituted.: ローカル データベース、つまり同期情報を再構成する必要があります。
The maximum duration for which chunks can be incubated within the document. Chunks exceeding this period will graduate to independent chunks.: ドキュメント内でチャンクを保持できる最大期間。この期間を超えたチャンクは独立したチャンクに昇格します。
The maximum number of chunks that can be incubated within the document. Chunks exceeding this number will immediately graduate to independent chunks.: ドキュメント内で保持できるチャンクの最大数。この数を超えたチャンクは即座に独立したチャンクに昇格します。
The maximum total size of chunks that can be incubated within the document. Chunks exceeding this size will immediately graduate to independent chunks.: ドキュメント内で保持できるチャンクの最大合計サイズ。このサイズを超えたチャンクは即座に独立したチャンクに昇格します。
The minimum interval for automatic synchronisation on event.: イベント発生時の自動同期における最小間隔です。
The remote is already set up, and the configuration is compatible (or got compatible by this operation).: リモートはすでに設定済みで、構成には互換性があります（または、この操作で互換性のある状態になりました）。
The Setup-URI does not appear to be valid. Please check that you have copied it correctly.: Setup-URI が有効ではないようです。正しくコピーできているか確認してください。
The Setup-URI is valid and ready to use.: Setup-URI は有効で、すぐに使用できます。
the single, authoritative master copy: 単一の権威あるマスターコピー
the synchronisation data on the server will be built based on the current data on this device.: サーバー上の同期データは、このデバイス上の現在のデータに基づいて構築されます。
Themes: テーマ
There is a way to resolve this on other devices.: 他のデバイスではこれを解決する方法があります。
There may be differences between the files in this Vault and the server.: このVaultとサーバー上のファイルに差異がある可能性があります。
Therefore, we ask that you exercise extreme caution when configuring server information manually. If an incorrect passphrase is entered, the data on the server will become corrupted.: したがって、サーバー情報を手動で設定する場合は、細心の注意を払ってください。間違ったパスフレーズを入力すると、サーバー上のデータが破損します。
This can isolate your connections between devices. Use the same Room ID for the same devices.: これにより、デバイス間の接続が分離される可能性があります。同じデバイスには同じルーム ID を使用してください。
This device: このデバイス
This device name: このデバイス名
This feature enables direct synchronisation between devices. No server is required, but both devices must be online at the same time for synchronisation to occur, and some features may be limited. Internet connection is only required to signalling (detecting peers) and not for data transfer.: この機能では端末同士を直接同期できます。サーバーは不要ですが、同期を行うには両端末が同時にオンラインである必要があり、一部機能は制限されます。インターネット接続はシグナリング（ピア検出）にのみ必要で、データ転送自体には使われません。
This is an advanced option for users who do not have a URI or who wish to configure detailed settings.: URI を持っていない場合や、詳細設定を手動で行いたいユーザー向けの上級者オプションです。
This is an extremely powerful operation. We strongly recommend that you copy your Vault folder to a safe location.: これは非常に強力な操作です。 Vault フォルダーを安全な場所にコピーすることを強くお勧めします。
This is the most suitable synchronisation method for the design. All functions are available. You must have set up a CouchDB instance.: この設計に最も適した同期方式です。すべての機能が利用できます。CouchDB インスタンスを事前に構成しておく必要があります。
This passphrase will not be copied to another device. It will be set to `Default` until you configure it again.: このパスフレーズは他のデバイスにコピーされません。再度設定するまで`Default`に設定されます。
This password is used to encrypt the connection. Use something long enough.: このパスワードは接続を暗号化するために使用されます。十分に長いものを使いましょう。
This procedure will first delete all existing synchronisation data from the server. Following this, the server data will be completely rebuilt, using the current state of your Vault on this device (including its local database) as:
    この手順では、まず既存の同期データをすべてサーバーから削除します。これに続いて、このデバイス上の Vault の現在の状態 (ローカル データベースを含む)
    を使用して、サーバーデータが完全に再構築されます。
This setting must be the same even when connecting to multiple synchronisation destinations.: この設定は複数の同期先に接続する場合でも同じにする必要があります。
This Vault is empty, or contains only new files that are not on the server.: このVaultは空、またはサーバーに存在しない新規ファイルのみを含んでいます。
This will rebuild the local database on this device using the most recent data from the server. This action is designed to resolve synchronisation inconsistencies and restore correct functionality.:
    これにより、サーバーからの最新のデータを使用して、このデバイス上にローカル
    データベースが再構築されます。このアクションは、同期の不一致を解決し、正しい機能を復元するように設計されています。
This will recreate chunks for all files. If there were missing chunks, this may fix the errors.: すべてのファイルについてチャンクを再作成します。欠損しているチャンクがあった場合、エラーが解消される可能性があります。
To minimise the creation of new conflicts: 新たな競合の発生を最小限に抑えるため
Transfer Tweak: 転送の調整
TURN Credential: TURN認証情報
TURN server settings are only necessary if you are behind a strict NAT or firewall that prevents direct P2P connections. In most cases, you can leave these fields blank.:
