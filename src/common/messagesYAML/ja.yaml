                _value: >
                    リモートデータベースがロックされています。これはいずれかの端末での再構築が原因です。

                    データベースの破損を避けるため、このデバイスは接続を保留するよう求められています。


                    3つのオプションがあります：


                    - %{Replicator.Dialogue.Locked.Action.Fetch}
                      最も推奨される信頼性の高い方法です。ローカルデータベースを一度破棄し、リモートデータベースからすべての同期情報を再取得します。ほとんどの場合、これは安全に実行できます。ただし、時間がかかり、安定したネットワークで実行する必要があります。
                    - %{Replicator.Dialogue.Locked.Action.Unlock}
                      この方法は、他のレプリケーション(複製)方法ですでに確実に同期されている場合のみ使用できます。単に同じファイルがあるという意味ではありません。確信がない場合は避けてください。
                    - %{Replicator.Dialogue.Locked.Action.Dismiss}
                      操作をキャンセルします。次回のリクエスト時に再度確認されます。
