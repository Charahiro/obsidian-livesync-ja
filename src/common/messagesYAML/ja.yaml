Setup:
    Apply:
        Buttons:
            ApplyAndFetch: 適用してフェッチ
            ApplyAndMerge: 適用してマージ
            ApplyAndRebuild: 適用して再構築
            Cancel: 破棄してキャンセル
            OnlyApply: 適用のみ
        Message: |-
            新しい設定の準備ができました。適用に進みましょう。
            適用方法はいくつかあります：

            - 適用してフェッチ
              このデバイスを新しいクライアントとして設定します。適用後、リモートサーバーから同期します。
            - 適用してマージ
              既にファイルがあるデバイスで設定します。ローカルファイルを処理し、差分を転送します。競合が発生する場合があります。
            - 適用して再構築
              ローカルファイルを使用してリモートを再構築します。これは通常、サーバーが破損した場合や最初からやり直したい場合に行います。
              他のデバイスはロックされ、再フェッチが必要になります。
            - 適用のみ
              適用のみを行います。再構築が必要な場合、競合が発生する可能性があります。
        Title: ${method}からの新しい設定を適用
        WarningRebuildRecommended: "注意: 設定の調整後、再構築が必要と判断されました。インポートのみは推奨されません。"
    Doctor:
        Buttons:
            No: いいえ、URIの設定をそのまま使用
            Yes: はい、診断ツールに相談する
        Message: |-
            Self-hosted LiveSyncは徐々に歴史が長くなり、一部の推奨設定が変更されています。

            セットアップは、これを行う非常に良い機会です。

            インポートされた設定が最新の状態と比較して最適かどうかを確認するために、診断ツールを実行しますか？
        Title: 診断ツールに相談しますか？
    FetchRemoteConf:
        Buttons:
            Fetch: はい、設定を取得
            Skip: いいえ、URIの設定を使用
        Message: |-
            既に他のデバイスと同期したことがある場合、リモートデータベースには同期されたデバイス間の適切な設定値が保存されています。プラグインは堅牢な設定のためにそれらを取得したいと考えています。

            ただし、1つ確認が必要です。現在、ネットワークに安全にアクセスして設定を取得できる状況ですか？

            注意: リモートデータベースがSSL証明書でホストされており、ネットワークが侵害されていなければ、ほとんどの場合安全に実行できます。
        Title: リモートデータベースから設定を取得しますか？
    QRCode: |-
        設定を転送するためのQRコードを生成しました。スマートフォンや他のデバイスでQRコードをスキャンしてください。
        注意: QRコードは暗号化されていないため、開く際は注意してください。

        >[!FOR YOUR EYES ONLY]-
        > <div class="sls-qr">${qr_image}</div>
    RemoteE2EE:
        AdvancedTitle: 詳細設定
        AlgorithmWarning: 暗号化アルゴリズムを変更すると、別のアルゴリズムで暗号化された既存データにはアクセスできなくなります。すべての端末で同じアルゴリズムを使うよう設定し、データにアクセスできる状態を維持してください。
        ButtonCancel: キャンセル
        ButtonProceed: 進む
        DefaultAlgorithmDesc:
            ほとんどの場合は、既定のアルゴリズム（${algorithm}）をそのまま使用してください。この設定が必要になるのは、既存の
            Vault が別の形式で暗号化されている場合のみです。
        Guidance: エンドツーエンド暗号化の設定を行ってください。
        LabelEncrypt: エンドツーエンド暗号化
        LabelEncryptionAlgorithm: 暗号化アルゴリズム
        LabelObfuscateProperties: プロパティを難読化
        MultiDestinationWarning: 複数の同期先へ接続する場合でも、この設定は同一である必要があります。
        ObfuscatePropertiesDesc: プロパティ（ファイルパス、サイズ、作成日時、更新日時など）を難読化すると、リモートサーバー上のファイルやフォルダーの構造や名前を特定しにくくできるため、追加の保護層になります。これによりプライバシーが守られ、権限のない第三者がデータに関する情報を推測しにくくなります。
        PassphraseValidationLine1: エンドツーエンド暗号化のパスフレーズは、実際に同期処理が開始されるまで検証されない点にご注意ください。これはデータを保護するためのセキュリティ対策です。
        PassphraseValidationLine2: そのため、サーバー情報を手動で設定する際は細心の注意を払ってください。誤ったパスフレーズを入力すると、サーバー上のデータが破損します。これは意図された動作ですので、あらかじめご理解ください。
        PlaceholderPassphrase: パスフレーズを入力してください
        StronglyRecommendedLine1: エンドツーエンド暗号化を有効にすると、データはリモートサーバーへ送信される前にこの端末上で暗号化されます。つまり、たとえ誰かがサーバーへアクセスできても、パスフレーズがなければデータを読むことはできません。他の端末でデータを復号する際にも必要になるため、パスフレーズは必ず覚えておいてください。
        StronglyRecommendedLine2: また、Peer-to-Peer 同期を使用している場合でも、将来ほかの方式へ切り替えてリモートサーバーへ接続するときには、この設定が使われます。
        StronglyRecommendedTitle: 強く推奨
        Title: エンドツーエンド暗号化
    ScanQRCode:
