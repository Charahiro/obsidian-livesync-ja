moduleCheckRemoteSize:
    logCheckingStorageSizes: ストレージサイズを確認中
    logCurrentStorageSize: "リモートストレージサイズ: ${measuredSize}"
    logExceededWarning: "リモートストレージサイズ: ${measuredSize} が ${notifySize} を超過しました"
    logThresholdEnlarged: しきい値が ${size}MB に設定されました
    msgConfirmRebuild: これは少し時間がかかる場合があります。本当に今すべてを再構築しますか？
    msgDatabaseGrowing: |
        **データベースが大きくなっています！** でも心配しないでください。リモートストレージの容量が不足する前に対応できます。

        | 測定サイズ | 設定サイズ |
        | --- | --- |
        | ${estimatedSize} | ${maxSize} |

        > [!MORE]-
        > 長年使用している場合、参照されていないチャンク（つまりゴミ）がデータベースに蓄積している可能性があります。そのため、すべてを再構築することをお勧めします。おそらくかなり小さくなるでしょう。
        >
        > 単純に保管庫の容量が増えている場合は、事前にファイルを整理してからすべてを再構築するのが良いでしょう。Self-hosted LiveSyncは処理速度を上げるため、削除しても実際のデータを削除しません。これはおおまかに[documentation](https://github.com/vrtmrz/obsidian-livesync/blob/main/docs/tech_info.md)に記載されています。
        >
        > 増加を気にしない場合は、通知制限を100MB単位で増やすことができます。これは自分のサーバーで実行している場合に適しています。ただし、定期的にすべてを再構築する方が良いでしょう。
        >

        > [!WARNING]
        > すべてを再構築する場合は、すべてのデバイスが同期されていることを確認してください。もちろん、プラグインは可能な限り解決しようと努力はしますけど...
    msgSetDBCapacity: |
        リモートストレージの容量が不足する前に対策を講じるため、**最大データベース容量の警告**を設定できます。
        これを有効にしますか？

        > [!MORE]-
        > - 0: ストレージサイズについて警告しない。
        >   自宅サーバーなど、リモートストレージに十分な容量がある場合に推奨されます。ストレージサイズを確認し、手動で再構築できます。
        > - 800: リモートストレージサイズが800MBを超えたら警告。
        >   1GB制限のfly.ioやIBM Cloudantを使用している場合に推奨されます。
        > - 2000: リモートストレージサイズが2GBを超えたら警告。

        制限に達した場合、段階的に制限を増やすよう求められます。
