"Scan every Vault file and live local-database revision for conflicts, missing chunks, and differences. Each result provides actions for the exact revision.": "すべてのVaultファイルと有効なローカルデータベースリビジョンを対象に、競合、不足チャンク、および差異を調べます。各結果から対象リビジョンに対する操作を実行できます。"
