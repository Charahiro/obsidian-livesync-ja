    msgRebuildRequired: |-
        変更を適用するにはデータベースの再構築が必要です。変更を適用する方法を選択してください。

        <details>
        <summary>凡例</summary>

        | 記号 | 意味 |
        |: ------ :| ------- |
        | ⇔ | 最新 |
        | ⇄ | 同期してバランスを取る |
        | ⇐,⇒ | 上書きするため転送 |
        | ⇠,⇢ | 反対側から上書きするため転送 |

        </details>

        ## ${OPTION_REBUILD_BOTH}
        概要: 📄 ⇒¹ 💻 ⇒² 🛰️ ⇢ⁿ 💻 ⇄ⁿ⁺¹ 📄
        このデバイスの既存ファイルを使用してローカルとリモートの両方のデータベースを再構築します。
