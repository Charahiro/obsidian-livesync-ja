            キーペアを生成しました！

            注意: このキーペアは再度表示されません。安全な場所に保存してください。紛失した場合は、新しいキーペアを生成する必要があります。
            注意2: 公開鍵はspki形式、秘密鍵はpkcs8形式です。利便性のため、公開鍵の改行は`\n`に変換されています。
            注意3: 公開鍵はリモートデータベースに、秘密鍵はローカルデバイスに設定してください。

            >[!FOR YOUR EYES ONLY]-
            > <div class="sls-keypair">
            >
            > ### 公開鍵
            > ```
            ${public_key}
            > ```
            >
            > ### 秘密鍵
            > ```
            ${private_key}
            > ```
            >
            > </div>

            >[!Both for copying]-
            >
            > <div class="sls-keypair">
            >
            > ```
            ${public_key}
            ${private_key}
            > ```
            >
            > </div>

        Title: 新しいキーペアが生成されました！
    TroubleShooting:
        _value: トラブルシューティング
        Doctor:
