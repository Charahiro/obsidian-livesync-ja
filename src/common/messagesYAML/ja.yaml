        ## ${OPTION_FETCH}
        概要: 📄 ⇄² 💻 ⇐¹ 🛰️ ⇔ 💻 ⇔ 📄
        ローカルデータベースを初期化し、リモートデータベースから取得したデータを使用して再構築します。
        リモートデータベースを再構築した場合も含まれます。
        ## ${OPTION_ONLY_SETTING}
        設定のみを保存します。**注意: データ破損につながる可能性があります**。通常、データベースの再構築が必要です。
