"The passphrase to encrypt the setup URI": "Setup URIを暗号化するパスフレーズ"
"The project's public signalling relay is a best-effort convenience operated by the project author. It does not store Vault contents, but signalling metadata may be visible to the relay. Availability and log retention are not guaranteed. You can replace it with your own Nostr-compatible relay.": "プロジェクトの公開シグナリングリレーは、作者がベストエフォートで運用する便宜的なサービスです。Vaultの内容は保存しませんが、シグナリングのメタデータはリレーから見える場合があります。可用性やログ保持は保証されません。独自のNostr互換リレーへ置き換えることもできます。"
"The settings are too large for one QR code, so multiple QR codes will be combined. Your settings are processed only on this device and are not sent to a server. Scan this QR code with your mobile camera and open the page in a browser. After all parts are collected, the page will return to Obsidian with the combined settings. Progress: ${CURRENT} / ${TOTAL}": "設定が1つのQRコードに収まらないため、複数のQRコードを結合します。設定はこのデバイス内だけで処理され、サーバーへ送信されません。モバイルのカメラでQRコードを読み取り、ブラウザーでページを開いてください。すべての部分を収集すると、結合した設定を使ってObsidianへ戻ります。進捗：${CURRENT} / ${TOTAL}"
"This file has ${COUNT} unresolved versions. They will be reviewed one pair at a time.": "このファイルには未解決のバージョンが${COUNT}件あります。2つずつ順番に確認します。"
"This file has unresolved conflicts.": "このファイルには未解決の競合があります。"
"This first setup has several short steps because it confirms encryption, the connection method, and which device provides the initial data. Once it is complete, additional devices can reuse a Setup URI.": "初回セットアップでは、暗号化、接続方法、および初期データを提供するデバイスを確認するため、いくつかの短い手順を行います。完了後は、追加のデバイスでSetup URIを再利用できます。"
"This optional check uses Obsidian's internal request API and sends the credentials above to the CouchDB server. Use it only with a server you trust; administrator access may be required.": "この任意の確認ではObsidianの内部リクエストAPIを使用し、上記の認証情報をCouchDBサーバーへ送信します。信頼できるサーバーでのみ使用してください。管理者権限が必要になる場合があります。"
