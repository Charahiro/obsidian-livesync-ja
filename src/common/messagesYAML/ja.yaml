  "SimpleFetch":
    "NewerWins": "ほかのデバイスで削除されたファイルをどのように扱いますか？


      - **${deleteRemote}**：リモートで削除されたローカルファイルも削除します。

      \  デバイス間でVaultを整理された一貫した状態に保てます。重要なデータがある場合は必ずバックアップしてください。

      - **${keepLocal}**：リモートで削除されていても、ローカルファイルから再作成します。

      \  ローカルファイルは保持されますが、重複が発生する可能性があります。同期後に手動で整理できます。"
    "RemoteWins": "ローカルファイルをリモートデータで上書きする場合、**リモートデータベースに存在しないローカルファイルをどのように扱いますか？**


      - **${deleteAll}**：ローカルにのみ存在するファイルと、リモートで削除されたファイルを削除します。

      \  ローカルVaultはリモートデータベースと同じ状態になります。重要なデータがある場合は必ずバックアップしてください。

      - **${keepAll}**：既存のローカルファイルをすべて保持します。

      \  ローカルファイルは保持されますが、リモートに存在しないファイルがあると重複が発生する可能性があります。同期後に手動で整理できます。"
    "Stage1": "リモートデータを取得します。


      最初に、リモートから取得するデータの扱い方を選択してください。


      - **${newerWins}**：ファイルの更新日時を比較し、新しい方を採用します。

      \  複数のデバイスで変更していた場合に、更新日時に基づいて変更を統合できます。

      - **${remoteWins}**：リモートデータを正として扱います。

      \  ローカルファイルはリモートデータで上書きされるため、重要なデータがある場合は必ずバックアップしてください。

      - **${detailed}**：詳細なセットアップウィザードを開きます。

      \  同期処理を細かく制御したい場合や、適用前に変更を確認したい場合に選択してください。"
"Reduces storage space by discarding all non-latest revisions. This requires the same amount of free space on the remote server and the local client.": "最新版以外のすべてのリビジョンを破棄して、使用容量を削減します。実行には、リモートサーバーとローカルクライアントの両方に同程度の空き容量が必要です。"
