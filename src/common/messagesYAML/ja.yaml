"All devices have the same progress value (${progress}). Your devices seem to be synchronised. And be able to proceed with Garbage Collection.": "すべてのデバイスで進捗値が同じです（${progress}）。デバイスは同期されているようなので、Garbage Collection を続行できます。"
"Garbage Collection Confirmation": "Garbage Collection の確認"
"Proceeding with Garbage Collection.": "Garbage Collection を実行します。"
"Garbage Collection: Scanned ${scanned} / ~${docCount}": "Garbage Collection: ${scanned} / ~${docCount} をスキャン済み"
"Garbage Collection: Scanning completed. Total chunks: ${totalChunks}, Used chunks: ${usedChunks}": "Garbage Collection: スキャン完了。総チャンク数: ${totalChunks}、使用中チャンク数: ${usedChunks}"
"Garbage Collection: Found ${unusedChunks} unused chunks to delete.": "Garbage Collection: 削除対象の未使用チャンクが ${unusedChunks} 件見つかりました。"
"Garbage Collection completed. Deleted chunks: ${deletedChunks} / ${totalChunks}. Time taken: ${seconds} seconds.": "Garbage Collection が完了しました。削除したチャンク: ${deletedChunks} / ${totalChunks}。所要時間: ${seconds} 秒。"
"Failed to start replication after Garbage Collection.": "Garbage Collection 後にレプリケーションを開始できませんでした。"
"Should we keep folders that don't have any files inside?": "中にファイルがないフォルダーを保持しますか？"
"Should we only check for conflicts when a file is opened?": "ファイルを開いたときのみ競合をチェックしますか？"
"Should we prompt you about conflicting files when a file is opened?": "ファイルを開いたときに競合ファイルについて確認を求めますか？"
"Should we prompt you for every single merge, even if we can safely merge automatcially?": "自動的に安全にマージできる場合でも、すべてのマージについて確認を求めますか？"
"Show full banner": "完全なバナーを表示"
"Show history": "履歴を表示"
"Show icon only": "アイコンのみ表示"
"Show only notifications": "通知のみ表示"
"Show status as icons only": "ステータス表示をアイコンのみにする"
"Show status icon instead of file warnings banner": "ファイル警告バナーの代わりにステータスアイコンを表示"
"Show status inside the editor": "ステータスをエディタ内に表示"
"Show status on the status bar": "ステータスバーに、ステータスを表示"
"Show verbose log. Please enable if you report an issue.": "エラー以外の詳細ログ項目も表示する。問題が発生した場合は有効にしてください。"
"Starts synchronisation when a file is saved.": "ファイルが保存されたときに同期を開始します。"
"Stop reflecting database changes to storage files.": "データベースの変更をストレージファイルに反映させない"
"Stop watching for file changes.": "監視の停止"
"Storage -> Database": "ストレージ → データベース"
"Suppress notification of hidden files change": "隠しファイルの変更通知を抑制"
"Suspend database reflecting": "データベース反映の一時停止"
"Suspend file watching": "監視の一時停止"
"Switch to IDB": "IDB に切り替える"
"Switch to IndexedDB": "IndexedDB に切り替える"
"Sync after merging file": "ファイルがマージ(統合)された時に同期"
"Sync automatically after merging files": "ファイルのマージ後に自動的に同期"
"Sync Mode": "同期モード"
"Sync on Editor Save": "エディタでの保存時に、同期されます"
"Sync on File Open": "ファイルを開いた時に同期"
"Sync on Save": "保存時に同期"
"Sync on Startup": "起動時同期"
"Synchronising files": "同期するファイル"
"Syncing": "同期"
"Target patterns": "対象パターン"
"Testing only - Resolve file conflicts by syncing newer copies of the file, this can overwrite modified files. Be Warned.": "テスト用 - ファイルの新しいコピーを同期してファイル競合を解決します。これにより変更されたファイルが上書きされる可能性があります。注意してください。"
"The delay for consecutive on-demand fetches": "連続したオンデマンドフェッチの遅延"
"The Group ID and passphrase are used to identify your group of devices. Make sure to use the same Group ID and passphrase on all devices you want to synchronise.": "グループ ID とパスフレーズは、デバイスのグループを識別するために使用されます。同期するすべてのデバイスで同じグループ ID とパスフレーズを使用してください。"
"The Hash algorithm for chunk IDs": "チャンクIDのハッシュアルゴリズム"
"The IndexedDB adapter often offers superior performance in certain scenarios, but it has been found to cause memory leaks when used with LiveSync mode. When using LiveSync mode, please use IDB adapter instead.": "IndexedDBアダプターは一部の状況で高い性能を発揮しますが、LiveSyncモードで使用するとメモリリークが発生することが分かっています。LiveSyncモードでは代わりにIDBアダプターを使用してください。"
"the latest synchronisation data will be downloaded from the server to this device.": "最新の同期データがサーバーからこのデバイスにダウンロードされます。"
"the local database, that is to say the synchronisation information, must be reconstituted.": "ローカル データベース、つまり同期情報を再構成する必要があります。"
"The maximum duration for which chunks can be incubated within the document. Chunks exceeding this period will graduate to independent chunks.": "ドキュメント内でチャンクを保持できる最大期間。この期間を超えたチャンクは独立したチャンクに昇格します。"
"The maximum number of chunks that can be incubated within the document. Chunks exceeding this number will immediately graduate to independent chunks.": "ドキュメント内で保持できるチャンクの最大数。この数を超えたチャンクは即座に独立したチャンクに昇格します。"
"The maximum total size of chunks that can be incubated within the document. Chunks exceeding this size will immediately graduate to independent chunks.": "ドキュメント内で保持できるチャンクの最大合計サイズ。このサイズを超えたチャンクは即座に独立したチャンクに昇格します。"
"The minimum interval for automatic synchronisation on event.": "イベント発生時の自動同期における最小間隔です。"
"The remote is already set up, and the configuration is compatible (or got compatible by this operation).": "リモートはすでに設定済みで、構成には互換性があります（または、この操作で互換性のある状態になりました）。"
"The Setup-URI does not appear to be valid. Please check that you have copied it correctly.": "Setup-URI が有効ではないようです。正しくコピーできているか確認してください。"
"The Setup-URI is valid and ready to use.": "Setup-URI は有効で、すぐに使用できます。"
"the single, authoritative master copy": "単一の権威あるマスターコピー"
"the synchronisation data on the server will be built based on the current data on this device.": "サーバー上の同期データは、このデバイス上の現在のデータに基づいて構築されます。"
"Themes": "テーマ"
"There is a way to resolve this on other devices.": "他のデバイスではこれを解決する方法があります。"
"There may be differences between the files in this Vault and the server.": "このVaultとサーバー上のファイルに差異がある可能性があります。"
"Therefore, we ask that you exercise extreme caution when configuring server information manually. If an incorrect passphrase is entered, the data on the server will become corrupted.": "したがって、サーバー情報を手動で設定する場合は、細心の注意を払ってください。間違ったパスフレーズを入力すると、サーバー上のデータが破損します。"
"This can isolate your connections between devices. Use the same Room ID for the same devices.": "これにより、デバイス間の接続が分離される可能性があります。同じデバイスには同じルーム ID を使用してください。"
"This device": "このデバイス"
"This device name": "このデバイス名"
"This is an extremely powerful operation. We strongly recommend that you copy your Vault folder to a safe location.": "これは非常に強力な操作です。 Vault フォルダーを安全な場所にコピーすることを強くお勧めします。"
"This passphrase will not be copied to another device. It will be set to `Default` until you configure it again.": "このパスフレーズは他のデバイスにコピーされません。再度設定するまで`Default`に設定されます。"
"This password is used to encrypt the connection. Use something long enough.": "このパスワードは接続を暗号化するために使用されます。十分に長いものを使いましょう。"
"This procedure will first delete all existing synchronisation data from the server. Following this, the server data will be completely rebuilt, using the current state of your Vault on this device (including its local database) as": "この手順では、まず既存の同期データをすべてサーバーから削除します。これに続いて、このデバイス上の Vault の現在の状態 (ローカル データベースを含む) を使用して、サーバーデータが完全に再構築されます。"
"This setting must be the same even when connecting to multiple synchronisation destinations.": "この設定は複数の同期先に接続する場合でも同じにする必要があります。"
"This Vault is empty, or contains only new files that are not on the server.": "このVaultは空、またはサーバーに存在しない新規ファイルのみを含んでいます。"
"This will rebuild the local database on this device using the most recent data from the server. This action is designed to resolve synchronisation inconsistencies and restore correct functionality.": "これにより、サーバーからの最新のデータを使用して、このデバイス上にローカル データベースが再構築されます。このアクションは、同期の不一致を解決し、正しい機能を復元するように設計されています。"
"This will recreate chunks for all files. If there were missing chunks, this may fix the errors.": "すべてのファイルについてチャンクを再作成します。欠損しているチャンクがあった場合、エラーが解消される可能性があります。"
"To minimise the creation of new conflicts": "新たな競合の発生を最小限に抑えるため"
"Transfer Tweak": "転送の調整"
"TURN Credential": "TURN認証情報"
"TURN server settings are only necessary if you are behind a strict NAT or firewall that prevents direct P2P connections. In most cases, you can leave these fields blank.": "TURN サーバー設定は、直接 P2P 接続を妨げる厳格な NAT またはファイアウォールの内側にいる場合にのみ必要です。ほとんどの場合、これらのフィールドは空白のままにしても問題ありません。"
"TURN Server URLs (comma-separated)": "TURNサーバーURL（コンマ区切り）"
"TURN Username": "TURNユーザー名"
