        警告: この機能は開発中です。以下の点にご注意ください：
        - 追記専用アーキテクチャ。ストレージを縮小するには再構築が必要です。
        - やや不安定です。
        - 初回同期時、すべての履歴がリモートから転送されます。データ制限と速度に注意してください。
        - ライブ同期は差分のみです。

