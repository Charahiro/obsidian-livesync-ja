"If enabled, efficient per-file customization sync will be used. A minor migration is required when enabling this feature, and all devices must be updated to v0.23.18. Enabling this feature will result in losing compatibility with older versions.": "有効にすると、効率的なファイル単位のカスタマイズ同期を使用します。有効化時に小規模な移行が必要で、すべてのデバイスをv0.23.18以降へ更新する必要があります。古いバージョンとの互換性は失われます。"
"If enabled, the P2P connection will be automatically started when the application launches.": "有効にすると、アプリケーションの起動時にP2P接続を自動的に開始します。"
"If enabled, the file properties will be encrypted in the remote database. This is useful for protecting sensitive information in file paths, sizes, and IDs of its chunks. If you are using V1 E2EE, this only obfuscates the file path.": "有効にすると、リモートデータベース内のファイル属性を暗号化します。ファイルパス、サイズ、およびチャンクIDの保護に役立ちます。V1 E2EEではファイルパスだけが難読化されます。"
"If enabled, the forcePathStyle option will be used for bucket operations.": "有効にすると、バケット操作にforcePathStyleオプションを使用します。"
"If enabled, the plugin will not attempt to connect to the remote database even if the chunk was not found locally.": "有効にすると、ローカルでチャンクが見つからない場合でも、プラグインはリモートデータベースへ接続しません。"
"If enabled, the request API will be used to avoid `inevitable` CORS problems. This is a workaround and may not work in all cases. PLEASE READ THE DOCUMENTATION BEFORE USING THIS OPTION. This is a less-secure option.": "有効にすると、避けられないCORS問題を回避するためにRequest APIを使用します。これは回避策であり、常に動作するとは限りません。使用前に必ずドキュメントを確認してください。安全性が低下する選択肢です。"
"If this enabled, JWT will be used for authentication.": "有効にすると、認証にJWTを使用します。"
"Internal timestamp for resolving compatible tweak mismatches.": "互換性のある調整値の不一致を解決するための内部タイムスタンプです。"
"Keep replication active in the background": "バックグラウンドでレプリケーションを維持"
"Key ID": "キーID"
"Keypair or pre-shared key": "鍵ペアまたは事前共有鍵"
"Last tweak modified timestamp": "調整値を最後に変更した時刻"
"Longest chunk line threshold value (Not Configurable from the UI Now).": "チャンクの最長行しきい値（現在UIから設定不可）"
"MB per request": "1リクエストあたりのMB"
"Maximum file modification time for reflected file events": "イベント反映時の最大ファイル更新日時"
"Maximum request size for manually resending chunks": "チャンクを手動再送信する際の最大リクエストサイズ"
"Minimum Chunk Size (Not Configurable from the UI Now).": "最小チャンクサイズ（現在UIから設定不可）"
"Move remotely deleted files to the trash, instead of deleting. (This setting is ineffective from Obsidian v1.7.2 onwards, as deletion always respects your Obsidian preferences.)": "リモートで削除されたファイルを完全削除せずゴミ箱へ移動します。（Obsidian v1.7.2以降では常にObsidianの削除設定が使われるため、この設定は動作に影響しません。）"
"Now we can choose how to split the chunks; V3 is the most efficient. If you have troubled, please make this Default or Legacy.": "チャンクの分割方式を選択できます。V3が最も効率的です。問題がある場合は「既定」または「レガシー」を選択してください。"
"Please use V2, V1 is deprecated and will be removed in the future, It was not a very appropriate algorithm. Only for compatibility V1 is kept.": "V2を使用してください。V1は非推奨で、将来削除されます。互換性のためにのみ維持されています。"
"Process files even if seems to be corrupted": "破損している可能性があるファイルも処理"
"Rotation Duration": "ローテーション期間"
"Signalling Relays": "シグナリングリレー"
"Subject (whoami)": "サブジェクト（whoami）"
"TURN Servers": "TURNサーバー"
"The Application ID for P2P connection. This should be same among your devices. Default is 'self-hosted-livesync' and could not be modified from the UI.": "P2P接続のアプリケーションIDです。すべてのデバイスで同じ値にする必要があります。既定値は「self-hosted-livesync」で、UIからは変更できません。"
"The Nostr relay servers to establish connections for P2P connections. Multiple servers can be separated by commas.": "P2P接続を確立するためのNostrリレーサーバーです。複数のサーバーはカンマで区切ります。"
"The Passphrase for P2P connection. This should be same among your devices.": "P2P接続のパスフレーズです。すべてのデバイスで同じ値にする必要があります。"
"The Room ID for P2P connection. This should be same among your devices.": "P2P接続のルームIDです。すべてのデバイスで同じ値にする必要があります。"
"The Rotation duration of token in minutes. Each generated tokens will be valid only within this duration.": "トークンのローテーション期間を分単位で指定します。生成された各トークンはこの期間内だけ有効です。"
"The TURN servers to use for P2P connections. Multiple servers can be separated by commas.": "P2P接続に使用するTURNサーバーです。複数のサーバーはカンマで区切ります。"
"The algorithm used for JWT authentication.": "JWT認証に使用するアルゴリズムです。"
"The credential/password for the TURN servers.": "TURNサーバーの認証情報またはパスワードです。"
"The key (PSK in HSxxx in base64, or private key in ESxxx in PEM) used for JWT authentication.": "JWT認証に使用する鍵です（HSxxxではBase64形式のPSK、ESxxxではPEM形式の秘密鍵）。"
"The key ID. this should be matched with CouchDB->jwt_keys->ALG:_`kid`.": "キーIDです。CouchDBのjwt_keysにあるALG:_`kid`と一致させてください。"
"The subject for JWT authentication. Mostly username.": "JWT認証のサブジェクトです。通常はユーザー名を指定します。"
"The username for the TURN servers.": "TURNサーバーのユーザー名です。"
"Use JWT instead of Basic Authentication": "Basic認証の代わりにJWTを使用"
"Use Only Local Chunks": "ローカルチャンクのみを使用"
"Use Request API to avoid `inevitable` CORS problem": "避けられないCORS問題を回避するためRequest APIを使用"
"While enabled, it causes very performance impact but debugging replication testing and other features will be enabled. Please disable this if you have not read the source code. Requires restart of Obsidian. Sometimes there is no implementation.": "有効にするとパフォーマンスへ大きく影響しますが、レプリケーションテストなどのデバッグ機能が有効になります。ソースコードを確認していない場合は無効にしてください。Obsidianの再起動が必要です。機能が実装されていない場合もあります。"
"You can enable this setting to process the files with size mismatches, these files can be created by some APIs or integrations.": "サイズ不一致のあるファイルを処理します。このようなファイルは一部のAPIや連携機能によって作成されることがあります。"
"xxhash64 is the current default.": "現在の既定値はxxhash64です。"
"wss://relay1.example.com,wss://relay2.example.com": "wss://relay1.example.com,wss://relay2.example.com"
"turn:turn1.example.com,turn:turn2.example.com": "turn:turn1.example.com,turn:turn2.example.com"
"x-custom-header1: value1\n x-custom-header2: value2": "x-custom-header1: value1

  \ x-custom-header2: value2"
