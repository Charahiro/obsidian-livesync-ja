"CompatibilityReview":
  "Action":
    "Back": "互換性レビューへ戻る"
    "KeepPaused": "同期を一時停止したままにする"
    "Resume": "同期を再開"
    "ReviewDetails": "互換性の詳細を確認"
  "Details":
    "Message": "## 同期が一時停止している理由


      ${reasons}


      ## 一時停止による変更


      - リモートレプリケーションは処理開始前に遮断されます。

      - 保存済みの自動同期設定は変更されません。

      - どちらのダイアログを閉じても安全確認は有効なままです。


      ## 次に行うこと


      ${resolution}"
    "ResolutionBlocked": "互換性のある最新バージョンのSelf-hosted LiveSyncをインストールしてください。現在のバージョンでは、この一時停止を解除できません。"
    "ResolutionResumable": "すべてのデバイスを更新した後、互換性レビューの概要へ戻り、同期を明示的に再開してください。その時点で現在の内部バージョンが確認済みとして記録されます。"
  "Reason":
    "DatabaseDowngrade": "- このバージョンが使用する内部データベースのバージョンは**${currentVersion}**ですが、このデバイスでは新しいバージョン**${acknowledgedVersion}**が以前に確認されています。古いバージョンから同期を再開することはできません。"
    "DatabaseInvalid": "- 保存されている内部データベースのバージョン情報が不正です。このバージョンでは**${currentVersion}**を使用します。"
    "DatabaseMissing": "- この既存Vaultで、以前に確認した内部データベースのバージョンが見つかりません。Vaultをコピーまたは復元した場合や、新しいObsidianプロファイルで開いた場合に発生します。このバージョンでは**${currentVersion}**を使用します。ローカルデータベースが空でも、自動的に同期を再開して安全であるとは限りません。"
    "DatabaseUpgrade": "- 最後に確認した内部データベースのバージョンは**${acknowledgedVersion}**で、このバージョンでは**${currentVersion}**を使用します。"
    "Legacy": "- 以前の互換性レビューが保留中です：${message}"
    "SettingsFuture": "- 保存済み設定のスキーマは**${sourceVersion}**で、このバージョンが対応するスキーマ**${currentVersion}**より新しくなっています。"
    "SettingsMigrated": "- 設定はスキーマ**${sourceVersion}**から**${currentVersion}**へ移行されており、同期を再開する前に確認が必要です。"
  "Summary":
    "ActionBlocked": "検出された状態をこのバージョンで安全に確認済みにすることはできません。再び同期を試す前にSelf-hosted LiveSyncを更新してください。"
    "ActionResumable": "再開する前に互換性の詳細を確認し、このリモートデータベースを使用するすべてのデバイスでSelf-hosted LiveSyncを更新してください。"
    "Message": "互換性の状態を確認する必要があるため、このデバイスではリモート同期を一時停止しています。


      ${action}


      自動同期の設定は変更されていません。このダイアログを閉じても同期は一時停止したままです。"
