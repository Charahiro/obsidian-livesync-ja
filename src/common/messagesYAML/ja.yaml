"Toggle LiveSync": "LiveSyncを切り替え"
"TURN relays the encrypted WebRTC connection only when a direct path cannot be established. A TURN provider cannot read encrypted Vault contents, but it can observe connection metadata and traffic volume. Use a provider you trust.": "TURNは直接経路を確立できない場合にのみ、暗号化されたWebRTC接続を中継します。TURNプロバイダーは暗号化されたVaultの内容を読み取れませんが、接続メタデータと通信量は観測できます。信頼できるプロバイダーを使用してください。"
